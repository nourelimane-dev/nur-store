<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NÜR | تفاصيل المنتج</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: '#f4efe6',
            charcoal: '#1c1c1c',
            terracotta: '#c96f4a',
            sand: '#e4dccb',
            warmgrey: '#8a8175'
          },
          fontFamily: {
            title: ['Playfair Display', 'serif'],
            body: ['Poppins', 'sans-serif']
          }
        }
      }
    }
  </script>
</head>
<body class="bg-cream text-charcoal font-body flex flex-col min-h-screen">

  <header class="bg-cream sticky top-0 z-50 border-b border-warmgrey/20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <a href="index.html" class="font-title text-3xl font-bold tracking-widest text-charcoal">NÜR</a>
      <nav class="hidden md:flex gap-8 text-sm font-medium">
        <a href="index.html" class="hover:text-terracotta transition">الرئيسية</a>
        <a href="shop.html" class="hover:text-terracotta transition">المتجر</a>
        <a href="about.html" class="hover:text-terracotta transition">من نحن</a>
        <a href="contact.html" class="hover:text-terracotta transition">اتصل بنا</a>
      </nav>
      <a href="cart.html" class="relative p-2 text-charcoal hover:text-terracotta transition">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
        </svg>
        <span id="cart-count" class="absolute -top-1 -right-1 bg-terracotta text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold">0</span>
      </a>
    </div>
  </header>

  <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
    <div id="product-details" class="grid md:grid-cols-2 gap-12 items-start"></div>
  </main>

  <footer class="bg-charcoal text-cream py-12 mt-16">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid md:grid-cols-3 gap-8 text-sm">
      <div class="space-y-3">
        <span class="font-title text-2xl tracking-widest block text-white">NÜR</span>
        <p class="text-warmgrey">تصاميم بسيطة، أنيقة، وعصرية.</p>
      </div>
      <div class="flex flex-col gap-2">
        <span class="text-white font-medium mb-1">الصفحات</span>
        <a href="index.html" class="text-warmgrey hover:text-cream">الرئيسية</a>
        <a href="shop.html" class="text-warmgrey hover:text-cream">المتجر</a>
        <a href="about.html" class="text-warmgrey hover:text-cream">من نحن</a>
        <a href="contact.html" class="text-warmgrey hover:text-cream">اتصل بنا</a>
      </div>
      <div class="space-y-2 text-warmgrey">
        <span class="text-white font-medium block mb-1">التواصل</span>
        <p>شارع ديدوش مراد، الجزائر العاصمة</p>
        <p>hello@nur.dz</p>
        <p>@nur.dz</p>
      </div>
    </div>
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-10 pt-6 border-t border-warmgrey/20 text-center text-xs text-warmgrey">
      © 2026 NÜR. جميع الحقوق محفوظة.
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="cart.js"></script>
  <script>
    const fallbackProducts = [
      { id: 1, name: "Essential Tee", category: "تيشيرت", price: 2900, image: "https://i.pinimg.com/736x/ea/b4/1d/eab41ddd59fba789429d3ab9aa699af2.jpg", description: "تيشيرت أساسي بتصميم أنيق ومريح للاستخدام اليومي." },
      { id: 2, name: "Oversized Hoodie", category: "هودي", price: 5900, image: "https://i.pinimg.com/736x/1c/fd/68/1cfd68f37b1f8e3c64ef56ff52b9c7ed.jpg", description: "هودي عصري واسع وقماش دافئ عالي الجودة." },
      { id: 3, name: "Denim Jacket", category: "جاكيت", price: 8900, image: "https://i.pinimg.com/1200x/9e/43/01/9e43019f0566b2ca31c99d129a61aecc.jpg", description: "جاكيت جينز كلاسيكي يدوم طويلاً مع أي إطلالة." },
      { id: 4, name: "Cargo Pants", category: "بنطال", price: 4900, image: "https://i.pinimg.com/736x/3e/f2/a9/3ef2a9e2b7eeb453f411ed9985244cf6.jpg", description: "بنطال كارغو عملي ومريح بجيب جانبية متناسقة." },
      { id: 5, name: "Knit Sweater", category: "سترة", price: 5400, image: "https://i.pinimg.com/736x/13/4f/83/134f838a6f8292656cd1934452af02a5.jpg", description: "سترة صوفية دافئة بتصميم بسيط وراقي." },
      { id: 6, name: "Classic Cap", category: "إكسسوار", price: 1900, image: "https://i.pinimg.com/736x/5e/54/47/5e544798fafeb92874da050f1398ab95.jpg", description: "قبعة كلاسيكية بلمسة عصرية تناسب جميع الأوقات." }
    ];

    let selectedSize = 'M';

    function renderDetails() {
      const allProducts = (typeof products !== 'undefined' && products.length) ? products : fallbackProducts;
      const params = new URLSearchParams(window.location.search);
      const productId = params.get('id') || 1;
      const product = allProducts.find(p => p.id === Number(productId)) || allProducts[0];

      const container = document.getElementById('product-details');
      container.innerHTML = `
        <div class="h-[500px] bg-sand overflow-hidden border border-warmgrey/10">
          <img src="${product.image}" alt="${product.name}" class="w-full h-full object-cover object-center">
        </div>
        <div class="space-y-6">
          <div>
            <span class="text-sm text-warmgrey uppercase">${product.category}</span>
            <h1 class="font-title text-3xl sm:text-4xl text-charcoal mt-1">${product.name}</h1>
            <p class="text-2xl font-semibold text-charcoal mt-3">${product.price.toLocaleString()} دج</p>
          </div>
          <p class="text-warmgrey leading-relaxed">${product.description}</p>
          <div>
            <label class="block text-sm font-medium mb-2">المقاس</label>
            <div class="flex gap-3">
              ${['S', 'M', 'L', 'XL'].map(size => `
                <button onclick="selectSize('${size}')" id="size-${size}" class="size-btn w-12 h-12 border border-warmgrey/30 text-sm font-medium transition ${size === 'M' ? 'bg-charcoal text-white border-charcoal' : 'bg-white text-charcoal'}">${size}</button>
              `).join('')}
            </div>
          </div>
          <div class="pt-4">
            <button onclick="if(typeof cart !== 'undefined'){ cart.addItem(${product.id}, selectedSize); alert('تمت الإضافة للسلة'); }" class="w-full bg-terracotta text-white py-4 font-medium hover:bg-opacity-90 transition">أضف إلى السلة</button>
          </div>
        </div>
      `;
    }

    function selectSize(size) {
      selectedSize = size;
      document.querySelectorAll('.size-btn').forEach(btn => {
        btn.className = 'size-btn w-12 h-12 border border-warmgrey/30 text-sm font-medium transition bg-white text-charcoal';
      });
      document.getElementById(`size-${size}`).className = 'size-btn w-12 h-12 border border-warmgrey/30 text-sm font-medium transition bg-charcoal text-white border-charcoal';
    }

    document.addEventListener('DOMContentLoaded', renderDetails);
  </script>
</body>
</html>
